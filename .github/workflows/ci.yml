name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: wells
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d wells"
          --health-interval 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r simulator/requirements.txt -r loader/requirements.txt pytest==8.3.3

      - name: Unit tests
        run: pytest -q

      - name: Apply schema and seed to a real Postgres
        env:
          PGPASSWORD: ci
        run: |
          psql -h localhost -U ci -d wells -v ON_ERROR_STOP=1 -f db/init/01_schema.sql
          psql -h localhost -U ci -d wells -v ON_ERROR_STOP=1 -f db/init/02_seed.sql
          psql -h localhost -U ci -d wells -v ON_ERROR_STOP=1 -f db/init/04_production.sql
          psql -h localhost -U ci -d wells -v ON_ERROR_STOP=1 -c "ALTER ROLE ingest_writer PASSWORD 'ci'"
          psql -h localhost -U ci -d wells -v ON_ERROR_STOP=1 -c "ALTER ROLE batch_loader PASSWORD 'ci'"

      - name: Run the simulator against it (2 hours of backfill, then stop)
        env:
          DATABASE_URL: postgresql://ingest_writer:ci@localhost:5432/wells
        run: |
          cd simulator
          timeout 20 python simulate.py --backfill 2 || [ $? -eq 124 ]

      - name: Check the data landed
        env:
          PGPASSWORD: ci
        run: |
          n=$(psql -h localhost -U ci -d wells -tAc "SELECT count(*) FROM core.readings")
          echo "valid readings: $n"
          test "$n" -gt 1000

      - name: Batch load the sample production file
        env:
          DATABASE_URL: postgresql://batch_loader:ci@localhost:5432/wells
        run: |
          cd loader
          python load_production.py ../tests/fixtures/sample_production.csv
          python load_production.py ../tests/fixtures/sample_production.csv   # second run must be skipped

      - name: Check the batch load results
        env:
          PGPASSWORD: ci
        run: |
          q() { psql -h localhost -U ci -d wells -tAc "$1"; }
          test "$(q "SELECT count(*) FROM core.daily_production")" -eq 1455
          test "$(q "SELECT count(*) FROM raw.production_rejected")" -eq 6
          test "$(q "SELECT count(*) FROM core.daily_production WHERE quality_flag IS NOT NULL")" -eq 1
          test "$(q "SELECT status FROM core.load_runs ORDER BY run_id DESC LIMIT 1")" = "skipped"
          echo "batch load checks passed"

      - name: Practice answers run without errors
        env:
          PGPASSWORD: ci
        run: psql -h localhost -U ci -d wells -v ON_ERROR_STOP=1 -f sql/practice_answers.sql > /dev/null

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the simulator image
        run: docker build -t well-simulator ./simulator
      - name: Build the loader image
        run: docker build -t well-loader ./loader
