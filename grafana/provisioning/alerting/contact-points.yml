apiVersion: 1
contactPoints:
- orgId: 1
  name: oncall-email
  receivers:
  - uid: oncall-email
    type: email
    disableResolveMessage: false
    settings:
      addresses: ${ALERT_EMAIL}
      singleEmail: true
policies:
- orgId: 1
  receiver: oncall-email
  group_by:
  - grafana_folder
  - alertname
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
